services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amagi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amagi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/amagi
      # No default on purpose: a fallback here would sign every JWT with a value
      # that is public in this repo. Compose interpolates this from `api/.env`
      # (or the shell) and refuses to start when it is missing or empty.
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in api/.env, see .env.example}"
    ports:
      - "8000:8000"

volumes:
  pgdata:
